name: 'Git Archaeologist'
description: 'Analyze git history for maintenance risk — curse-score hotspots and bus-factor-1 scopes — and comment on pull requests.'
author: 'Sushant Verma'
branding:
  icon: 'git-branch'
  color: 'orange'

inputs:
  top:
    description: 'How many of the highest-risk ("cursed") files to report.'
    required: false
    default: '10'
  since:
    description: 'Only analyze commits after this point (e.g. "1y", "90d", "2024-01-01"). Empty means full history.'
    required: false
    default: ''
  fail-on-curse-score:
    description: 'Fail the job if the top cursed file scores at or above this value. 0 disables the gate.'
    required: false
    default: '0'
  github-token:
    description: 'Token used to post the analysis as a pull-request comment. Usually ${{ secrets.GITHUB_TOKEN }}.'
    required: false
    default: ${{ github.token }}

outputs:
  top-cursed-file:
    description: 'Path of the highest-curse-score file found.'
  top-curse-score:
    description: 'Curse score of that file.'

runs:
  using: 'node20'
  main: 'action/dist/index.js'
