name: 'Git Archaeologist PR Reviewer'
description: 'Intercepts PRs, analyzes structural maintenance risk, and posts a clean Markdown summary.'
author: 'Sushant Verma'
branding:
  icon: 'git-branch'
  color: 'orange'

inputs:
  github-token:
    description: 'Token used to post the PR comment. Must have pull-requests: write.'
    required: true
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Detect and fix shallow clones
      shell: bash
      run: |
        if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
          echo "⚠️ Shallow clone detected. Git Archaeologist requires full history to calculate temporal ownership and blast radius."
          echo "Fetching full history automatically..."
          git fetch --unshallow || git fetch --all
        else
          echo "✅ Full git history verified."
        fi

    - name: Install dependencies
      shell: bash
      run: npm install -g git-archaeologist@latest

    - name: Run Analysis & Generate Comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "Not a pull request. Skipping PR comment generation."
          exit 0
        fi
        
        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        
        echo "Extracting PR files..."
        gh pr view $PR_NUMBER --repo $REPO --json files -q '.files[].path' > pr_files.txt
        
        echo "Running macro analysis..."
        git-arch analyze . --json > macro.json
        
        # Convert pr_files.txt to JSON array
        jq -R -s 'split("\n") | map(select(length > 0))' pr_files.txt > pr_files_json.json
        
        # Build Markdown Comment
        COMMENT="## ⛏ Git Archaeologist Review\n\n"
        COMMENT+="> *Automated structural risk assessment based on commit history.*\n\n"
        
        COMMENT+="### 📊 Repository Risk Summary\n"
        TOTAL_FILES=$(grep -c "^" pr_files.txt || true)
        COMMENT+="**Files analyzed in this PR:** $TOTAL_FILES\n\n"
        
        COMMENT+="### ⚠️ High-Risk Files\n"
        HIGH_RISK_LIST=$(jq -r --slurpfile pr pr_files_json.json '.cursedFiles[] | select(.filepath as $f | any($pr[0][]; . == $f)) | "- `\(.filepath)` (Curse Score: **\(.curseScore | round)**)"' macro.json || true)
        
        if [ -z "$HIGH_RISK_LIST" ]; then
          COMMENT+="✅ No structurally decaying files modified.\n\n"
        else
          COMMENT+="$HIGH_RISK_LIST\n\n"
        fi
        
        COMMENT+="### 🔗 Coupling Warnings (Blast Radius)\n"
        echo "Running blast radius analysis..."
        git-arch blast-batch . --from-file pr_files.txt --json > blast_batch.json 2>/dev/null || true
        
        COUPLING_LIST=$(jq -r --slurpfile pr pr_files_json.json '.results | to_entries[] | select(.key as $f | any($pr[0][]; . == $f)) | select(.value | length > 0) | "**\(.key)** historically changes alongside:\n" + (.value[] | "- \(.pct)% \(.file)")' blast_batch.json 2>/dev/null || true)
        
        if [ -z "$COUPLING_LIST" ]; then
          COMMENT+="✅ No hidden dependencies detected.\n\n"
        else
          COMMENT+="$COUPLING_LIST\n\n"
        fi
        
        COMMENT+="### 🚌 Ownership Suggestions\n"
        COMMENT+="If this PR modifies core architecture, ensure it is reviewed by the historical owners, not just random assignees.\n\n"
        
        COMMENT+="---\n*[Git Archaeologist](https://github.com/SushantVerma7969/git-archaeologist)* | *Stop guessing the blast radius.*"
        
        echo -e "$COMMENT" > pr_comment.md
        
        echo "Posting PR comment..."
        gh pr comment $PR_NUMBER --repo $REPO --body-file pr_comment.md
